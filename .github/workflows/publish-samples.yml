name: Publish Samples

on:
  push:
    branches: [ main ]
    paths:
      - 'Samples/**'
      - 'scripts/build-samples.ps1'
      - '.github/workflows/publish-samples.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag to publish downloadable sample archives under'
        required: false
        default: 'samples-latest'

concurrency:
  group: publish-samples
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-samples:
    name: Build & Publish Sample Archives
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate package & sample catalog hygiene
        shell: pwsh
        run: ./scripts/verify-repo.ps1 -SkipTests

      - name: Build & verify sample archives and manifest
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { "samples-latest" }
          ./scripts/build-samples.ps1 -OutputDir Build/Samples -ReleaseTag "$tag" -Repository "${{ github.repository }}"

      - name: Upload samples to GitHub Release & prune stale archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG="${INPUT_TAG:-samples-latest}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Build/Samples/* --clobber
            EXISTING_ZIPS=$(gh release view "$TAG" --json assets --jq '.assets[].name | select(endswith(".zip"))')
            for asset in $EXISTING_ZIPS; do
              if [ ! -f "Build/Samples/$asset" ]; then
                echo "Pruning stale sample asset: $asset"
                gh release delete-asset "$TAG" "$asset" --yes
              fi
            done
          else
            gh release create "$TAG" Build/Samples/* \
              --title "ContentContent Samples ($TAG)" \
              --notes "Automated downloadable sample archives for ContentContent UPM packages."
          fi
